name: CDT synthetic tests
on:
  pull_request:
    paths:
      - 'cdt/**'
      - 'tests/test_cdt*.py'
      - '.github/workflows/cdt-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run CDT synthetic tests
        run: python -m unittest discover -s tests -p 'test_cdt*.py' -v
